{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw Wallet - ResultPin.ng</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --green: #008751;
            --dark: #0b2c3d;
            --light: #f7f9f8;
            --accent: #ff6d00;
        }

        body {
            background: var(--light);
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        .navbar {
            background: var(--dark);
        }

        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        footer {
            background: var(--dark);
            color: #fff;
            padding: 2rem 0;
            margin-top: 4rem;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">
            <img src="{% static 'store/images/logo.jpg' %}" height="55">
        </a>
        <div class="d-flex align-items-center gap-3">
            <span class="text-white fw-bold">
                Welcome, {{ user.first_name|default:user.username }}
            </span>
            <a href="{% url 'wallet' %}" class="btn btn-outline-light btn-sm">Wallet</a>
            <a href="{% url 'logout' %}" class="btn btn-outline-light btn-sm">Logout</a>
        </div>
    </div>
</nav>

<div class="container my-5">

    <h1 class="text-center mb-5 fw-bold" style="color: var(--green);">
        Withdraw to Bank
    </h1>

    <!-- WITHDRAW FORM -->
    <div class="card p-4 mb-5">
        <h4 class="fw-bold text-center">Withdraw Funds</h4>
        <form method="post" action="{% url 'wallet_withdraw' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label for="amount" class="form-label">Amount (₦)</label>
                <input type="number" class="form-control" id="amount" name="amount" min="100" max="{{ user.balance }}" required>
            </div>
            <!-- Assume bank details are pre-saved; add fields if needed -->
            <button type="submit" class="btn btn-primary btn-lg w-100">
                <i class="fas fa-bank"></i> Withdraw Now
            </button>
        </form>
    </div>

</div>

<footer class="text-center">
    <p>© 2025 ResultPin.ng • Secure Wallet System</p>
</footer>

</body>
</html>
