{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Changed – KoboTap</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --green: #008751;
            --green-dark: #006b40;
            --light-bg: #f4f8f6;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(135deg, #0b2c3d, #008751);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .complete-card {
            width: 100%;
            max-width: 520px;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 22px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            text-align: center;
        }

        .complete-header {
            background: linear-gradient(135deg, var(--green), var(--green-dark));
            padding: 3rem 2rem 2rem;
            color: #fff;
        }

        .complete-header i {
            font-size: 4.5rem;
            margin-bottom: 1rem;
        }

        .complete-header h2 {
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .complete-header p {
            font-size: 1rem;
            opacity: 0.9;
        }

        .complete-body {
            padding: 2.2rem;
        }

        .btn-login {
            background: var(--green);
            color: #fff;
            border-radius: 50px;
            padding: 14px 32px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            background: var(--green-dark);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 135, 81, 0.35);
        }

        @media (max-width: 576px) {
            .complete-body {
                padding: 1.8rem;
            }
        }
    </style>
</head>
<body>

<div class="complete-card">

    <!-- Header -->
    <div class="complete-header">
        <i class="fas fa-check-circle"></i>
        <h2>Password Changed</h2>
        <p>Your password has been updated successfully</p>
    </div>

    <!-- Body -->
    <div class="complete-body">
        <p class="lead text-muted mb-4">
            You can now log in with your new password.
        </p>

        <a href="{% url 'login' %}" class="btn btn-login">
            Go to Login
        </a>

        <small class="text-muted d-block mt-5">
            <i class="fas fa-lock me-1"></i> Secure & Encrypted – Your account is protected
        </small>
    </div>
</div>

</body>
</html>
