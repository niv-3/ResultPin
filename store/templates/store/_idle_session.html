<dialog id="idle-warning" aria-labelledby="idle-heading" style="max-width:360px;width:calc(100% - 32px);border:1px solid #dce5e9;border-radius:18px;padding:24px;color:#0b2c3d;box-shadow:0 14px 60px #0b2c3d44">
  <h2 class="h5" id="idle-heading">Still there?</h2>
  <p>You’ll be signed out soon because you haven’t used Payvict for a while.</p>
  <button type="button" class="btn btn-dark w-100 mb-2" id="idle-stay">Stay signed in</button>
  <button type="button" class="btn btn-outline-secondary w-100" id="idle-signout">Sign out</button>
</dialog>
<form id="idle-signout-form" method="post" action="{% url 'logout' %}" hidden>{% csrf_token %}</form>
<script>
(() => {
  const timeout = {{ idle_timeout_seconds }} * 1000;
  const warningLead = Math.min(60000, timeout / 4);
  const pingInterval = Math.min(30000, timeout / 12);
  const key = 'payvict-activity-{{ user.pk }}';
  const logoutKey = key + '-logout';
  const warning = document.getElementById('idle-warning');
  const form = document.getElementById('idle-signout-form');
  let last = {{ idle_activity_at }} * 1000 || Date.now();
  let lastPing = 0, ending = false, pinging = false;
  const read = () => { try { return Math.min(Date.now(), Number(localStorage.getItem(key)) || 0); } catch { return 0; } };
  const save = () => { try { localStorage.setItem(key, String(last)); } catch {} };
  last = Math.max(last, read());
  save();
  const closeWarning = () => { if (warning.open) warning.close(); };
  async function signOut() {
    if (ending) return;
    ending = true;
    try { localStorage.setItem(logoutKey, String(Date.now())); } catch {}
    try {
      await fetch(form.action, {method:'POST', body:new FormData(form), credentials:'same-origin',
        headers:{Accept:'application/json'}, signal:AbortSignal.timeout(5000)});
    } catch {}
    location.replace('{% url "login" %}?expired=1');
  }
  async function ping() {
    if (ending || pinging || Date.now() - lastPing < pingInterval) return;
    pinging = true;
    lastPing = Date.now();
    try {
      const response = await fetch('{% url "session_activity" %}', {
        method:'POST', credentials:'same-origin', cache:'no-store',
        headers:{Accept:'application/json', 'X-CSRFToken':form.elements.csrfmiddlewaretoken.value}
      });
      if (response.status === 401 || response.redirected) signOut();
    } catch { /* The server still enforces expiry while offline. */ }
    finally { pinging = false; }
  }
  function activity(event) {
    if (event && !event.isTrusted) return;
    last = Math.max(last, read());
    if (Date.now() - last >= timeout) { signOut(); return; }
    last = Date.now();
    save();
    closeWarning();
    ping();
  }
  function check() {
    if (ending) return;
    last = Math.max(last, read());
    const idle = Date.now() - last;
    if (idle >= timeout) { signOut(); return; }
    if (idle >= timeout - warningLead && !document.hidden && !warning.open) warning.showModal();
    else if (idle < timeout - warningLead) closeWarning();
  }
  // Interaction, not background fetches or automatic slides, refreshes activity.
  ['pointerdown','keydown','touchstart','wheel'].forEach(name => document.addEventListener(name, event => {
    if (warning.open && !event.target.closest?.('#idle-stay')) return;
    activity(event);
  }, {passive:true}));
  document.getElementById('idle-stay').addEventListener('click', activity);
  document.getElementById('idle-signout').addEventListener('click', signOut);
  warning.addEventListener('cancel', event => { event.preventDefault(); });
  window.addEventListener('storage', event => {
    if (event.key === logoutKey) location.replace('{% url "login" %}?expired=1');
    else if (event.key === key) check();
  });
  document.addEventListener('visibilitychange', check);
  window.addEventListener('pageshow', check);
  setInterval(check, 1000);
  check();
})();
</script>
