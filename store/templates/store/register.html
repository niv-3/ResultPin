<!-- templates/store/register.html -->
{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Register - ResultPin.ng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background: linear-gradient(135deg, #008751, #fff, #008751); 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
        }
        .card { 
            max-width: 500px; 
            margin: auto; 
            border-radius: 20px; 
        }
    </style>
</head>
<body>
<div class="card shadow-lg">
    <div class="card-body p-5">
        <h2 class="text-center text-white bg-success py-3 rounded-top">Create Account</h2>

        {% if messages %}
            {% for msg in messages %}
                <div class="alert alert-{{ msg.tags|default:'info' }} text-center">
                    {{ msg }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="row">
                <div class="col-6">
                    <input type="text" name="first_name" class="form-control mb-3" placeholder="First Name" required>
                </div>
                <div class="col-6">
                    <input type="text" name="last_name" class="form-control mb-3" placeholder="Last Name" required>
                </div>
            </div>

            <input type="text" name="phone" class="form-control mb-3" placeholder="Phone Number (e.g 08012345678)" required>
            <input type="email" name="email" class="form-control mb-3" placeholder="Email Address" required>
            <input type="password" name="password" class="form-control mb-3" placeholder="Create Password" required>
            <input type="password" name="password2" class="form-control mb-4" placeholder="Confirm Password" required>

            <button type="submit" class="btn btn-success btn-lg w-100">Send OTP to Phone</button>
        </form>

        <p class="text-center mt-3">
            Already have account? <a href="{% url 'login' %}">Login here</a>
        </p>
    </div>
</div>
</body>
</html>
