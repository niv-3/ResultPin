<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify Email - ResultPin.ng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #008751, #ffffff, #008751);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            max-width: 450px;
            width: 100%;
            border-radius: 20px;
        }
    </style>
</head>
<body>

<div class="card shadow-lg">
    <div class="card-body p-5 text-center">
        <h2 class="text-white bg-success py-3 rounded mb-4">
            Verify Your Email
        </h2>

        {% if messages %}
            {% for msg in messages %}
                <div class="alert alert-{{ msg.tags|default:'danger' }} fw-bold alert-dismissible fade show">
                    {{ msg }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        <p class="text-muted mb-4">
            We sent a 6-digit code to your email.<br>
            <small>Check spam folder if not in inbox</small>
        </p>

        <form method="post" action="{% url 'verify_otp' %}">
            {% csrf_token %}
            <input
                type="text"
                name="otp"
                id="otp-input"
                class="form-control text-center fs-3 mb-4"
                maxlength="6"
                pattern="[0-9]{6}"
                inputmode="numeric"
                autocomplete="one-time-code"
                placeholder="------"
                style="letter-spacing: 12px; font-weight: bold;"
                required
                autofocus
            >

            <button type="submit" class="btn btn-success btn-lg w-100 mb-3">
                Verify & Login
            </button>
        </form>

        <div class="mt-4">
            <p id="countdown" class="fs-5 fw-bold text-danger">
                Time left: 10:00
            </p>

            <p>
                <span id="resend-link-wrapper">
                    <a href="{% url 'resend_otp' %}" id="resend-link" class="text-decoration-none text-muted">
                        Resend OTP
                    </a>
                </span>
                |
                <a href="{% url 'register' %}" class="text-decoration-none">
                    ← Change Email
                </a>
            </p>
        </div>
    </div>
</div>

<script>
    let seconds = 600;
    const countdown = document.getElementById("countdown");
    const resendLink = document.getElementById("resend-link");

    resendLink.style.pointerEvents = "none";
    resendLink.style.opacity = "0.5";

    const timer = setInterval(() => {
        seconds--;
        const min = String(Math.floor(seconds / 60)).padStart(2, '0');
        const sec = String(seconds % 60).padStart(2, '0');

        if (seconds <= 0) {
            clearInterval(timer);
            countdown.innerText = "OTP expired – request a new one below";
            countdown.classList.remove("text-danger");
            countdown.classList.add("text-muted");
            resendLink.style.pointerEvents = "auto";
            resendLink.style.opacity = "1";
        } else {
            countdown.innerText = `Time left: ${min}:${sec}`;
            if (seconds <= 30) {
                resendLink.style.pointerEvents = "auto";
                resendLink.style.opacity = "1";
            }
        }
    }, 1000);

    // Auto-submit on 6 digits
    document.getElementById('otp-input').addEventListener('input', function(e) {
        this.value = this.value.replace(/\D/g, '');
        if (this.value.length === 6) {
            this.form.submit();
        }
    });
</script>

</body>
</html>
