<!DOCTYPE html>
<html>
<head><title>Verify OTP - ResultPin.ng</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#f8f9fa; padding-top:100px}</style>
</head>
<body>
<div class="container">
    <div class="card shadow mx-auto" style="max-width:400px">
        <div class="card-body p-5 text-center">
            <h3>Enter OTP</h3>
            <p>We sent a 6-digit code to your phone</p>
            <form method="post">
                {% csrf_token %}
                <input type="text" name="otp" class="form-control text-center Rfs" maxlength="6" placeholder="000000" required>
                <button class="btn btn-success w-100 mt-4">Verify & Login</button>
            </form>
            <p class="mt-3"><a href="{% url 'resend_otp' %}">Resend OTP</a></p>
            <p><a href="{% url 'register' %}">← Back</a></p>
        </div>
    </div>
</div>
</body>
</html>
