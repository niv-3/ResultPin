{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Bank Account - Payvict</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --green: #008751; --dark: #0b2c3d; }
        body { background: #f7f9f8; font-family: 'Segoe UI', sans-serif; }
        .navbar { background: var(--dark); }
        .card { border: none; border-radius: 16px; box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">{% include 'store/brand_logo.html' %}</a>
        <div class="d-flex gap-3">
            <a href="{% url 'wallet' %}" class="btn btn-outline-light btn-sm">Back to Wallet</a>
        </div>
    </div>
</nav>

<div class="container my-5">
    <h1 class="text-center mb-5 fw-bold" style="color: var(--green);">Add Bank Account</h1>

    <div class="card p-4 mx-auto" style="max-width: 500px;">
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-bold">Select Bank</label>
                <select class="form-select" name="bank_code" required>
                    <option value="">Choose your bank</option>
                    {% for bank in banks %}
                    <option value="{{ bank.code }}">{{ bank.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Account Number</label>
                <input type="text" class="form-control" name="account_number" maxlength="10" placeholder="e.g. 0123456789" required>
            </div>

            <button type="submit" class="btn btn-success btn-lg w-100">
                Verify & Save Account
            </button>
        </form>

        <div class="text-center mt-3">
            <small class="text-muted">We verify your name instantly via Paystack</small>
        </div>
    </div>
</div>

</body>
</html>
