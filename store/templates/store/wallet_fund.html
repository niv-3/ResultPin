{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fund Wallet - ResultPin.ng</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --green: #008751;
            --dark: #0b2c3d;
            --light: #f7f9f8;
            --accent: #ff6d00;
        }

        body {
            background: var(--light);
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        .navbar {
            background: var(--dark);
        }

        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        footer {
            background: var(--dark);
            color: #fff;
            padding: 2rem 0;
            margin-top: 4rem;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">
            <img src="{% static 'store/images/logo.jpg' %}" height="55">
        </a>
        <div class="d-flex align-items-center gap-3">
            <span class="text-white fw-bold">
                Welcome, {{ user.first_name|default:user.username }}
            </span>
            <a href="{% url 'wallet' %}" class="btn btn-outline-light btn-sm">Wallet</a>
            <a href="{% url 'logout' %}" class="btn btn-outline-light btn-sm">Logout</a>
        </div>
    </div>
</nav>

<div class="container my-5">

    <h1 class="text-center mb-5 fw-bold" style="color: var(--green);">
        Fund Your Wallet
    </h1>

    <!-- FUND FORM -->
    <div class="card p-4 mb-5">
        <h4 class="fw-bold text-center">Add Funds</h4>
        <form id="fund-form">
            {% csrf_token %}
            <div class="mb-3">
                <label for="amount" class="form-label">Amount (₦)</label>
                <input type="number" class="form-control" id="amount" min="100" step="1" required placeholder="e.g. 1000">
                <small class="text-muted">Minimum: ₦100</small>
            </div>
            <button type="submit" class="btn btn-success btn-lg w-100">
                <i class="fas fa-plus-circle"></i> Fund Now with Paystack
            </button>
        </form>
    </div>

</div>

<!-- Updated to Paystack v2 -->
<script>
function getCSRFToken() {
    const name = "csrftoken";
    const cookies = document.cookie.split(";");
    for (let cookie of cookies) {
        cookie = cookie.trim();
        if (cookie.startsWith(name + "=")) {
            return cookie.substring(name.length + 1);
        }
    }
    return "";
}

document.getElementById("fund-form").addEventListener("submit", function (e) {
    e.preventDefault();

    const amount = document.getElementById("amount").value.trim();

    if (!amount || parseFloat(amount) < 100) {
        alert("Minimum funding amount is ₦100");
        return;
    }

    const button = e.target.querySelector("button[type='submit']");
    button.disabled = true;
    button.innerHTML = "Processing... Please wait";

    fetch("{% url 'wallet_fund_init' %}", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": getCSRFToken()
        },
        body: JSON.stringify({ amount: parseFloat(amount) })
    })
    .then(response => response.json())
    .then(data => {
        if (data.status === true && data.data && data.data.authorization_url) {
            // THIS IS THE KEY LINE — SAME AS YOUR WORKING AIRTIME
            window.location.href = data.data.authorization_url;
        } else {
            alert(data.message || "Unable to start payment. Try again.");
            button.disabled = false;
            button.innerHTML = "Fund Now with Paystack";
        }
    })
    .catch(err => {
        console.error(err);
        alert("Network error. Check your connection and try again.");
        button.disabled = false;
        button.innerHTML = "Fund Now with Paystack";
    });
});
</script>
<footer class="text-center">
    <p>© 2025 ResultPin.ng • Secure Wallet System</p>
</footer>

</body>
</html>
