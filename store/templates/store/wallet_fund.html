{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fund Wallet - ResultPin.ng</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --green: #008751;
            --dark: #0b2c3d;
            --light: #f7f9f8;
            --accent: #ff6d00;
        }

        body {
            background: var(--light);
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        .navbar {
            background: var(--dark);
        }

        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        footer {
            background: var(--dark);
            color: #fff;
            padding: 2rem 0;
            margin-top: 4rem;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">
            <img src="{% static 'store/images/logo.jpg' %}" height="55" alt="ResultPin.ng">
        </a>
        <div class="d-flex align-items-center gap-3">
            <span class="text-white fw-bold">
                Welcome, {{ user.first_name|default:user.username }}
            </span>
            <a href="{% url 'wallet' %}" class="btn btn-outline-light btn-sm">Wallet</a>
            <a href="{% url 'logout' %}" class="btn btn-outline-light btn-sm">Logout</a>
        </div>
    </div>
</nav>

<div class="container my-5">

    <h1 class="text-center mb-5 fw-bold" style="color: var(--green);">
        Fund Your Wallet
    </h1>

    <!-- FUND FORM -->
    <div class="card p-4 mb-5">
        <h4 class="fw-bold text-center">Add Funds</h4>

        <form id="fund-form">
            {% csrf_token %}

            <div class="mb-3">
                <label for="amount" class="form-label">Amount (₦)</label>
                <input 
                    type="number" 
                    class="form-control" 
                    id="amount" 
                    min="100" 
                    step="1" 
                    required 
                    placeholder="e.g. 1000"
                >
                <small class="text-muted">Minimum: ₦100</small>
            </div>

            <button type="submit" class="btn btn-success btn-lg w-100">
                <i class="fas fa-plus-circle"></i> Fund Now with Paystack
            </button>
        </form>
    </div>

</div>

<!-- JAVASCRIPT (CSRF SAFE + FULL DEBUG) -->
<script>
function getCSRFToken() {
    const name = 'csrftoken=';
    const cookies = document.cookie.split(';');

    for (let cookie of cookies) {
        cookie = cookie.trim();
        if (cookie.startsWith(name)) {
            console.log("CSRF token found in cookie");
            return cookie.substring(name.length);
        }
    }

    console.warn("CSRF token NOT found");
    return '';
}

function resetButton() {
    const button = document.querySelector("#fund-form button[type='submit']");
    if (button) {
        button.disabled = false;
        button.innerHTML = '<i class="fas fa-plus-circle"></i> Fund Now with Paystack';
    }
}

window.addEventListener("load", resetButton);

document.getElementById("fund-form").addEventListener("submit", function (e) {
    e.preventDefault();

    const amountInput = document.getElementById("amount").value.trim();
    const amount = parseFloat(amountInput);

    console.log("Form submitted. Amount:", amount);

    if (!amountInput || amount < 100) {
        alert("Please enter an amount of ₦100 or more");
        return;
    }

    const button = this.querySelector("button[type='submit']");
    button.disabled = true;
    button.innerHTML = "Initializing...";

    const csrfToken = getCSRFToken();
    console.log("Using CSRF token:", csrfToken ? "OK" : "MISSING");

    fetch("{% url 'wallet_fund_init' %}", {
        method: "POST",
        credentials: "same-origin",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": csrfToken,
            "X-Requested-With": "XMLHttpRequest"
        },
        body: JSON.stringify({ amount: amount })
    })
    .then(response => {
        console.log("HTTP status:", response.status);

        if (!response.ok) {
            return response.text().then(text => {
                console.error("Server returned HTML error:", text.substring(0, 500));
                throw new Error("HTTP error " + response.status);
            });
        }

        return response.json();
    })
    .then(data => {
        console.log("Response JSON:", data);

        if (data.status && data.data && data.data.authorization_url) {
            button.innerHTML = "Redirecting...";
            window.location.href = data.data.authorization_url;
        } else {
            alert(data.message || "Invalid response");
            resetButton();
        }
    })
    .catch(err => {
        console.error("Fetch failed:", err);
        alert("Network or server error — check browser console (F12)");
        resetButton();
    });
});
</script>

<footer class="text-center">
    <p>© 2026 ResultPin.ng • Secure Wallet System</p>
</footer>

</body>
</html>
