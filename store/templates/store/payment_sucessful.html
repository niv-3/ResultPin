{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Payment Successful - ResultPin.ng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #008751; color: white; text-align: center; padding-top: 100px; }
        .pin-box { background: white; color: #008751; padding: 30px; border-radius: 20px; display: inline-block; font-size: 2rem; margin: 20px 0; }
    </style>
</head>
<body>
    <h1>Payment Successful!</h1>
    <h2>Your {{ txn.product.name }} e-PIN:</h2>
    <div class="pin-box">
        <strong>{{ pin }}</strong>
    </div>
    <p>PIN has been sent to your email & phone.</p>
    <a href="{% url 'home' %}" class="btn btn-light btn-lg mt-4">Buy Another PIN</a>
</body>
</html>
