<style>
.password-visibility-wrap { position: relative; }
.password-visibility-wrap input { padding-right: 3.25rem !important; }
.password-visibility-button { position: absolute; right: .35rem; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; display: grid; place-items: center; border: 0; border-radius: 8px; background: transparent; color: #123543; cursor: pointer; }
.password-visibility-button:focus-visible { outline: 2px solid #ff6d00; outline-offset: 1px; }
.password-visibility-button svg { width: 22px; height: 22px; }
</style>
<script>
(() => {
    document.querySelectorAll('input[type="password"]').forEach((input, index) => {
        if (!input.id) input.id = 'password-field-' + index;
        let wrap = input.parentElement;
        if (!wrap.classList.contains('input-wrap')) {
            wrap = document.createElement('div');
            input.before(wrap);
            wrap.append(input);
        }
        wrap.classList.add('password-visibility-wrap');
        wrap.querySelectorAll('.input-icon').forEach(icon => icon.remove());
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'password-visibility-button';
        button.setAttribute('aria-controls', input.id);
        const icon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>';
        function update() {
            const visible = input.type === 'text';
            button.setAttribute('aria-label', visible ? 'Hide password' : 'Show password');
            button.setAttribute('aria-pressed', String(visible));
            button.innerHTML = icon + (visible ? '<path d="m3 3 18 18"/>' : '') + '</svg>';
        }
        button.addEventListener('click', () => { input.type = input.type === 'password' ? 'text' : 'password'; update(); });
        window.addEventListener('pageshow', () => { input.type = 'password'; update(); });
        update();
        wrap.append(button);
    });
})();
</script>
