{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Login - ResultPin.ng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-body">
                    <h3 class="text-center text-success">Login</h3>
                    <form method="post">
                        {% csrf_token %}
                        <input type="text" name="username" class="form-control mb-3" placeholder="Phone or Username" required>
                        <input type="password" name="password" class="form-control mb-3" placeholder="Password" required>
                        <button type="submit" class="btn btn-success w-100">Login</button>
                    </form>
                    <p class="text-center mt-3"><a href="{% url 'register' %}">Create account</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
