<!-- templates/store/login.html -->
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login – ResultPin.ng</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --green: #008751;
            --green-dark: #006b40;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(135deg, #0b2c3d, #008751);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 460px;
            background: rgba(255, 255, 255, 0.97);
            border-radius: 22px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.25);
            overflow: hidden;
        }

        .login-header {
            background: linear-gradient(135deg, var(--green), var(--green-dark));
            padding: 2rem;
            text-align: center;
            color: #fff;
        }

        .login-header h3 {
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .login-header p {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-bottom: 0;
        }

        .login-body {
            padding: 2.2rem;
        }

        .form-control {
            border-radius: 14px;
            padding: 14px 16px;
            font-size: 0.95rem;
            border: 1px solid #ddd;
        }

        .form-control:focus {
            border-color: var(--green);
            box-shadow: 0 0 0 0.2rem rgba(0, 135, 81, 0.15);
        }

        .btn-login {
            background: var(--green);
            color: #fff;
            border-radius: 50px;
            padding: 14px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            background: var(--green-dark);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 135, 81, 0.35);
        }

        .links a {
            color: var(--green);
            font-weight: 600;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .alert {
            border-radius: 14px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="login-card">

    <!-- Header -->
    <div class="login-header">
        <h3>Welcome Back</h3>
        <p>Login to continue to ResultPin.ng</p>
    </div>

    <!-- Body -->
    <div class="login-body">

        <!-- Messages (filtered) -->
        {% if messages %}
            {% for msg in messages %}
                {% if "product_id" not in msg|stringformat:"s" %}
                    <div class="alert alert-{{ msg.tags|default:'info' }} text-center fw-semibold mb-4">
                        {{ msg }}
                    </div>
                {% endif %}
            {% endfor %}
        {% endif %}

        <!-- Login Form -->
        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <input type="text" name="username" class="form-control"
                       placeholder="Email or phone number" required>
            </div>

            <div class="mb-4">
                <input type="password" name="password" class="form-control"
                       placeholder="Password" required>
            </div>

            <button type="submit" class="btn btn-login w-100">
                Login
            </button>
        </form>

        <div class="text-center mt-4 links">
            <p class="mb-1">
                Don’t have an account?
                <a href="{% url 'register' %}">Create one</a>
            </p>
            <p>
                <a href="{% url 'password_reset' %}">Forgot password?</a>
            </p>
        </div>

    </div>
</div>

</body>
</html>
