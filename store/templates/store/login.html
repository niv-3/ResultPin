{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Login - ResultPin.ng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #008751, #fff, #008751);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .card {
            max-width: 400px;
            margin: auto;
            border-radius: 15px;
        }
    </style>
</head>
<body>
<div class="card shadow-lg">
    <div class="card-body p-4">
        <h3 class="text-center text-white bg-success py-3 rounded-top">Login</h3>

        <!-- Messages -->
        {% if messages %}
            {% for msg in messages %}
                <div class="alert alert-{{ msg.tags|default:'info' }} text-center mt-3">
                    {{ msg }}
                </div>
            {% endfor %}
        {% endif %}

        <!-- Login Form -->
        <form method="post" class="mt-3">
            {% csrf_token %}
            <div class="mb-3">
                <input type="text" name="username" class="form-control" placeholder="Email or Phone number" required>
            </div>
            <div class="mb-3">
                <input type="password" name="password" class="form-control" placeholder="Password" required>
            </div>
            <button type="submit" class="btn btn-success w-100">Login</button>
        </form>

        <div class="text-center mt-3">
            <p>Don't have an account? <a href="{% url 'register' %}">Register here</a></p>
            <p><a href="{% url 'password_reset' %}">Forgot Password?</a></p>
        </div>
    </div>
</div>
</body>
</html>
